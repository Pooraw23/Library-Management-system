<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Smart Library Management System</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container"></div>
  </nav>

  <!-- Main Content -->
  <main class="main-content" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:75vh;">
    <div class="card" style="width:100%; max-width:440px; border-top: 4px solid var(--primary);">
      <div style="text-align:center; margin-bottom: 1.5rem;">
        <span style="font-size:2.2rem;">📚</span>
        <h2 style="font-size: 1.5rem; font-weight:700; margin-top:0.25rem;">Sign In to SmartLib</h2>
        <p style="font-size: 0.875rem; color: var(--text-muted);">Access your library account, borrowed books, or circulation desk</p>
      </div>

      <!-- Error Alert -->
      <div id="login-error" style="display:none; background:#fee2e2; border:1px solid #f87171; color:#991b1b; padding:0.75rem; border-radius:6px; margin-bottom:1.25rem; font-size:0.875rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@college.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width:100%; margin-top:0.5rem; padding:0.75rem;">Sign In</button>
      </form>

      <div style="text-align:center; margin-top:1.25rem; font-size:0.875rem; color:var(--text-muted);">
        Don't have an account yet? <a href="/register.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Register here</a>
      </div>

      <!-- Quick Demo Credentials -->
      <div style="margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border);">
        <p style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.5rem; text-align:center;">
          ⚡ Quick Demo Credentials (1-Click Fill)
        </p>
        <div style="display:flex; flex-direction:column; gap:0.4rem;">
          <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('admin@library.edu', 'admin123')" style="justify-content:space-between; font-size:0.78rem;">
            <span>🛡️ <strong>Admin:</strong> admin@library.edu</span>
            <code>admin123</code>
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('librarian@library.edu', 'librarian123')" style="justify-content:space-between; font-size:0.78rem;">
            <span>📖 <strong>Librarian:</strong> librarian@library.edu</span>
            <code>librarian123</code>
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('john.doe@student.edu', 'member123')" style="justify-content:space-between; font-size:0.78rem;">
            <span>🎓 <strong>Member:</strong> john.doe@student.edu</span>
            <code>member123</code>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Smart Library Management System • DBMS Project</p>
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
