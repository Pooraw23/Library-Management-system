<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Library Management System</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container"></div>
  </nav>

  <!-- Main Content -->
  <main class="main-content" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh;">
    <div class="card" style="width:100%; max-width:480px; border-top: 4px solid var(--primary);">
      <div style="text-align:center; margin-bottom: 1.5rem;">
        <span style="font-size:2.2rem;">🎓</span>
        <h2 style="font-size: 1.5rem; font-weight:700; margin-top:0.25rem;">Create Library Member Account</h2>
        <p style="font-size: 0.875rem; color: var(--text-muted);">Register to borrow books, reserve popular titles, and view personal circulation</p>
      </div>

      <!-- Error Alert -->
      <div id="register-error" style="display:none; background:#fee2e2; border:1px solid #f87171; color:#991b1b; padding:0.75rem; border-radius:6px; margin-bottom:1.25rem; font-size:0.875rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">College / Institutional Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="john.doe@student.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-department">Academic Department</label>
          <input type="text" id="reg-department" class="form-control" placeholder="e.g. Computer Science & Engineering">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-type password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width:100%; margin-top:0.5rem; padding:0.75rem;">Create Account</button>
      </form>

      <div style="text-align:center; margin-top:1.25rem; font-size:0.875rem; color:var(--text-muted);">
        Already registered? <a href="/login.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Sign in here</a>
      </div>
    </div>
  </main>

  <footer>
    <p>Smart Library Management System • DBMS Project</p>
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/register.js"></script>
</body>
</html>
